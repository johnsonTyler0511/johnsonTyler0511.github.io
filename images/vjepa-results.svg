<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img"
  aria-label="Pick-and-place success rate by goal schedule. Paper's 3 goal images: MuJoCo 0 of 6, Isaac 1 of 6. Plus retract and place images: MuJoCo 20 of 40, Isaac 7 of 20. Plus pregrasp image (6 images): MuJoCo 28 of 40, Isaac 12 of 20.">
  <style>
    .bg { fill: #062940; }
    .head { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #9fc3cd; letter-spacing: 0.08em; }
    .subtitle { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fc3cd; }
    .grid { stroke: #1f4d68; stroke-width: 1; }
    .tick { font: 400 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #9fc3cd; }
    .mj { fill: #6fd6c3; }
    .is { fill: #ff9b85; }
    .val { font: 400 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #9fc3cd; }
    .val-hero { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e6f1ec; }
    .xlab { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6f1ec; }
    .xsub { font: 400 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #9fc3cd; }
    .leg { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6f1ec; }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="470"/>

  <text class="head" x="40" y="36">PICK-AND-PLACE SUCCESS</text>
  <text class="subtitle" x="40" y="58">Share of scenes where the object ends in the plate, by goal schedule</text>

  <!-- legend -->
  <rect class="mj" x="560" y="26" width="12" height="12" rx="2"/>
  <text class="leg" x="578" y="37">MuJoCo</text>
  <rect class="is" x="648" y="26" width="12" height="12" rx="2"/>
  <text class="leg" x="666" y="37">Isaac Sim</text>

  <!-- grid: 0..100 %, 3 px per percent, baseline y=390 -->
  <line class="grid" x1="80" y1="390" x2="760" y2="390"/>
  <line class="grid" x1="80" y1="315" x2="760" y2="315"/>
  <line class="grid" x1="80" y1="240" x2="760" y2="240"/>
  <line class="grid" x1="80" y1="165" x2="760" y2="165"/>
  <line class="grid" x1="80" y1="90" x2="760" y2="90"/>
  <text class="tick" x="68" y="394" text-anchor="end">0%</text>
  <text class="tick" x="68" y="319" text-anchor="end">25%</text>
  <text class="tick" x="68" y="244" text-anchor="end">50%</text>
  <text class="tick" x="68" y="169" text-anchor="end">75%</text>
  <text class="tick" x="68" y="94" text-anchor="end">100%</text>

  <!-- bars: MuJoCo 0/6, 20/40, 28/40; Isaac 1/6, 7/20, 12/20 (3 px per percent) -->
  <rect class="mj" x="159" y="388" width="36" height="2"/>
  <path class="is" d="M 203 390 L 203 344 Q 203 340 207 340 L 235 340 Q 239 340 239 344 L 239 390 Z"/>
  <text class="val" x="177" y="380" text-anchor="middle">0/6</text>
  <text class="val" x="221" y="330" text-anchor="middle">1/6</text>
  <path class="mj" d="M 384 390 L 384 244 Q 384 240 388 240 L 416 240 Q 420 240 420 244 L 420 390 Z"/>
  <path class="is" d="M 428 390 L 428 289 Q 428 285 432 285 L 460 285 Q 464 285 464 289 L 464 390 Z"/>
  <text class="val" x="402" y="230" text-anchor="middle">20/40</text>
  <text class="val" x="446" y="275" text-anchor="middle">7/20</text>
  <path class="mj" d="M 609 390 L 609 184 Q 609 180 613 180 L 641 180 Q 645 180 645 184 L 645 390 Z"/>
  <path class="is" d="M 653 390 L 653 214 Q 653 210 657 210 L 685 210 Q 689 210 689 214 L 689 390 Z"/>
  <text class="val-hero" x="627" y="170" text-anchor="middle">28/40</text>
  <text class="val-hero" x="671" y="200" text-anchor="middle">12/20</text>

  <!-- x labels -->
  <text class="xlab" x="199" y="416" text-anchor="middle">3 goal photos</text>
  <text class="xsub" x="199" y="436" text-anchor="middle">the paper's recipe</text>
  <text class="xlab" x="424" y="416" text-anchor="middle">+ retract, place</text>
  <text class="xsub" x="424" y="436" text-anchor="middle">5 photos</text>
  <text class="xlab" x="649" y="416" text-anchor="middle">+ pregrasp</text>
  <text class="xsub" x="649" y="436" text-anchor="middle">6 photos</text>
</svg>
